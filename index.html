<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="EstiloCalculadora.css">
</head>
<body>
    <div class="CalculadoraPantalla">

    <input type="text"id="DisplayCalculadora" disabled>
    
    <div class="CalculatorButtons">

    <button onclick="ButtonNumber('7')">7</button>
    <button onclick="ButtonNumber('8')">8</button>
    <button onclick="ButtonNumber('9')">9</button>
    <button onclick="Operation('/')">/</button>

    <button onclick="ButtonNumber('4')">4</button>
    <button onclick="ButtonNumber('5')">5</button>
    <button onclick="ButtonNumber('6')">6</button>
    <button onclick="Operation('*')">*</button>

    <button onclick="ButtonNumber('1')">1</button>
    <button onclick="ButtonNumber('2')">2</button>
    <button onclick="ButtonNumber('3')">3</button>
    <button onclick="Operation('-')">-</button>

    <button onclick="ButtonNumber('0')">0</button>
    <button onclick="ButtonSing('.')">.</button>
    <button onclick="ClearDisplay('C')">C</button>
    <button onclick="Operation('+')">+</button>
    
    
    <button onclick="ClearValue('«')">«</button>   
    <button onclick="CalculateOperation()" id="OperationResult">=</button>
      
    </div>
    </div>  



    <script src="script.js"></script>
</body>
</html>
