<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="EstiloCalculadora.css">
</head>
<body>
    <div class="CalculadoraPantalla">
    <input type="text"id="CalculadoraDisplay" disabled>
    
    <div class="CalculadoraBotones">

        <button onclick="BotonNro('7')">7</button>
        <button onclick="BotonNro('8')">8</button>        
        <button onclick="BotonNro('9')">9</button>
        <button onclick="BotonNro('/')">/</button>

        <button onclick="BotonNro('4')">4</button>
        <button onclick="BotonNro('5')">5</button>
        <button onclick="BotonNro('6')">6</button>
        <button onclick="PonerOperacion('*')">*</button>

        <button onclick="BotonNro('1')">1</button>
        <button onclick="BotonNro('2')">2</button>
        <button onclick="BotonNro('3')">3</button>
        <button onclick="PonerOperacion('-')">-</button>

        <button onclick="BotonNro('0')">0</button>
        <button onclick="BotonNro('.')">.</button>
        <button onclick="LimpearDispley('C')">C</button>
        <button onclick="PonerOperacion('+')">+</button>

        <button onclick="EliminarValor('«')">«</button>
        <button onclick="CalcularOperacion()" id="ResultadoOperacion">=</button>





    <script src="script.js"></script>
</body>
</html>
